name: Desplegar TFG en InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Subir archivos por FTP
    runs-on: ubuntu-latest

    # GitHub buscará el entorno llamado exactamente "InfinityFree"
    environment: InfinityFree

    steps:
      - name: Descargar código del repo 
        uses: actions/checkout@v4

      - name: Sincronizar con InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWD }}
          server-dir: /htdocs/